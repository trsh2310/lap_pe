dataset:
  _target_: src.datasets.RecSysDataset
  name: yelp2018_dhg
  url: ''
model:
  _target_: src.models.TiSASRec
  name: tisasrec_mti_256
  seed: 42
  device: cuda
  lr: 0.002654457743148157
  n_epochs: 1000
  hidden_size: 64
  num_blocks: 1
  num_heads: 4
  dropout: 0.5
  seq_len: 200
  batch_size: 512
  filter_seen: true
  max_patience: 10
  max_time_interval: 256
  relation_chunk_size: 0
metrics:
- _target_: src.metrics.NDCGMetric
  k: 100
- _target_: src.metrics.NDCGMetric
  k: 10
- _target_: src.metrics.RecallMetric
  k: 100
- _target_: src.metrics.RecallMetric
  k: 10
- _target_: src.metrics.CoverageMetric
  k: 100
- _target_: src.metrics.CoverageMetric
  k: 10
seed: 42
max_top_n: 100
