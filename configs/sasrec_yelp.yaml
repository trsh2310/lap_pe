defaults:
  - dataset: Yelp2018
  - metrics: base
  - _self_

model:
  _target_: src.models.SASRecModel
  name: sasrec_yelp
  seed: 42
  device: cuda
  lr: 0.002654457743148157
  n_epochs: 1000
  hidden_size: 64
  num_blocks: 1
  num_heads: 4
  dropout: 0.5
  seq_len: 200
  batch_size: 512
  filter_seen: true
  use_absolute_pe: true
  max_patience: 10

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100
