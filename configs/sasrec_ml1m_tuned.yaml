defaults:
  - dataset: MovieLens-1M
  - model: sasrec
  - metrics: base
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100

model:
  name: sasrec_ml1m_tuned
  seed: 42
  device: cuda
  lr: 0.006770186482827876
  n_epochs: 30
  hidden_size: 128
  num_blocks: 2
  num_heads: 2
  dropout: 0.2
  seq_len: 200
  batch_size: 128
  filter_seen: true
  max_patience: 10
