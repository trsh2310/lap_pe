defaults:
  - dataset: Amazon2014-Sports-And-Outdoors
  - model: sasrec_mlp
  - metrics: base
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100

model:
  seed: 42
  device: cuda
  lr: 0.005452572110078795
  hidden_size: 128
  num_blocks: 1
  num_heads: 1
  dropout: 0.4
  seq_len: 200
  batch_size: 512
  filter_seen: true
  max_patience: 10
  lap_eigvec_path: Amazon2014-Sports-And-Outdoors_eigvecs.npy
  lap_project_chunk_size: 1024
  item_chunk_size: 2048
