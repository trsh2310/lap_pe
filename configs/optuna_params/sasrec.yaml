- name: lr
  type: float
  low: 1e-5
  high: 1e-2

- name: hidden_size
  type: categorical
  choices:
    - 64
    - 128
    - 256
    - 512

- name: num_heads
  type: categorical
  choices:
    - 1
    - 2
    - 4

- name: dropout
  type: float
  log: false
  low: 0.0
  high: 0.5
  step: 0.1

- name: batch_size
  type: categorical
  choices:
    - 128
    - 256
    - 512

- name: num_blocks
  type: int
  low: 1
  high: 4
  step: 1
