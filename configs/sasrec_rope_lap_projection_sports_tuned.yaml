defaults:
  - dataset: Amazon2014-Sports-And-Outdoors
  - model: sasrec_rope_lap_projection
  - metrics: base
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100

model:
  _target_: src.models.sasrec_rope_lap_projection.SASRecRoPELapProjection
  name: sasrec_rope_lap_projection_sports_tuned
  seed: 42
  device: cuda
  lr: 0.005452572110078795
  n_epochs: 1000
  hidden_size: 128
  num_blocks: 1
  num_heads: 1
  dropout: 0.4
  seq_len: 200
  batch_size: 512
  filter_seen: true
  max_patience: 10
  k: 128
  lap_projection_mode: v
  lap_eigvec_path: Amazon2014-Sports-And-Outdoors_eigvecs.npy
  lap_alpha: 0.01
  learnable_lap_gate: false
  lap_gate_init: -3.0
  rope_base: 10000.0
