defaults:
  - dataset: Amazon2014-Sports-And-Outdoors
  - metrics: base
  - _self_

model:
  _target_: src.models.SASRecRoPE
  name: sasrec_rope_sports
  seed: 42
  device: cuda
  lr: 0.005452572110078795
  n_epochs: 1000
  hidden_size: 128
  num_blocks: 1
  num_heads: 1
  dropout: 0.4
  seq_len: 200
  batch_size: 512
  filter_seen: true
  max_patience: 10
  rope_base: 10000.0

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100
