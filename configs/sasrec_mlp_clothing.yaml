defaults:
  - dataset: Amazon2014-Clothing-Shoes-And-Jewelry
  - model: sasrec_mlp
  - metrics: base
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100

model:
  seed: 42
  device: cuda
  lr: 0.00021124444422497844
  hidden_size: 512
  num_blocks: 2
  num_heads: 1
  dropout: 0.30000000000000004
  seq_len: 200
  batch_size: 256
  filter_seen: true
  max_patience: 10
  lap_eigvec_path: Amazon2014-Clothing-Shoes-And-Jewelry_eigvecs.npy
  lap_project_chunk_size: 1024
  item_chunk_size: 2048
