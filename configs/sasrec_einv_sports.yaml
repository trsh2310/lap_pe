defaults:
  - metrics: base
  - _self_

dataset:
  _target_: src.datasets.RecSysDataset
  name: Amazon2014-Sports-And-Outdoors
  url: https://disk.360.yandex.ru/d/cUBZLP_OoLankw?path=/Amazon2014-Sports-And-Outdoors

model:
  _target_: src.models.sasrec_einv.SASRecEinv
  name: sasrec_einv_sports_first
  seed: 42
  device: cuda
  lr: 0.005452572110078795
  hidden_size: 128
  num_blocks: 1
  num_heads: 1
  dropout: 0.4
  seq_len: 200
  batch_size: 512
  filter_seen: true
  max_patience: 10
  lap_eigvec_path: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100
