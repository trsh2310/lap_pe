defaults:
  - dataset: Amazon2014-Beauty
  - metrics: base
  - _self_

model:
  _target_: src.models.SASRecModel
  name: sasrec_beauty
  seed: 42
  device: cuda
  lr: 0.007155250682439438
  n_epochs: 1000
  hidden_size: 64
  num_blocks: 2
  num_heads: 1
  dropout: 0.5
  seq_len: 200
  batch_size: 256
  filter_seen: true
  use_absolute_pe: true
  max_patience: 10

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${model.name}__${dataset.name}__${now:%H-%M-%S}

seed: 42
max_top_n: 100
